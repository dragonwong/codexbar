name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app and package
        run: bash scripts/package.sh
      - name: Test JSON-RPC reader
        run: python3 -m unittest discover -s tests -v
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' dist/CodexBar.app/Contents/Info.plist)
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: CodexBar-universal
          path: |
            dist/*.zip
            dist/*.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CodexBar-universal
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "CodexBar $GITHUB_REF_NAME" --notes 'Universal macOS app (Intel + Apple Silicon), macOS 13+. Requires an installed Codex signed in with ChatGPT. Ad-hoc signed, not notarized: see README for first launch instructions.'
